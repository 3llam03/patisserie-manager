version: '3.8'

services:
  db:
    image: postgres:16
    container_name: patisserie_db
    environment:
      POSTGRES_DB: patisserie_db
      POSTGRES_USER: patisserie_user
      POSTGRES_PASSWORD: yourpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: patisserie_server
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: patisserie_db
      DB_USER: patisserie_user
      DB_PASSWORD: yourpassword
      JWT_SECRET: patisserie_super_secret_2024
    ports:
      - "5000:5000"
    depends_on:
      - db

  client:
    build: ./client
    container_name: patisserie_client
    environment:
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
